            { fi: "Välttämätön", en: "Necessary", level: "B2" },
            { fi: "Mahdoton", en: "Impossible", level: "B2" },
            { fi: "Todennäköinen", en: "Probable", level: "B2" },
            { fi: "Epävarma", en: "Uncertain", level: "B2" },
            // Idioms & Complex Verbs (from text context)
            { fi: "Kyseenalaistaa", en: "To question/challenge", level: "B2" },
            { fi: "Vuorovaikutus", en: "Interaction", level: "B2" },
            { fi: "Säännönmukaisuus", en: "Regularity", level: "B2" },
            { fi: "Heittäytyä", en: "To throw oneself into", level: "B2" },
            { fi: "Sietää", en: "To tolerate/endure", level: "B2" },
            { fi: "Hakeutua", en: "To seek out/apply", level: "B2" },
            { fi: "Tiedostaa", en: "To be aware of", level: "B2" },
            { fi: "Edellyttää", en: "To require/presuppose", level: "B2" },
            { fi: "Keskittyä", en: "To concentrate", level: "B2" },
            { fi: "Perehtyä", en: "To familiarize oneself", level: "B2" },
            { fi: "Poiketa", en: "To stop by/deviate", level: "B2" },
            { fi: "Arvostella", en: "To criticize/review", level: "B2" },
            { fi: "Törmätä", en: "To collide/bump into", level: "B2" },
            { fi: "Keskeyttää", en: "To interrupt", level: "B2" },
            { fi: "Haaveilla", en: "To dream (daydream)", level: "B2" },
            { fi: "Kaivata", en: "To miss/long for", level: "B2" },
            { fi: "Vaikuttaa", en: "To seem/influence", level: "B2" },
            { fi: "Kuvailla", en: "To describe", level: "B2" },
            { fi: "Johdos", en: "Derivative", level: "B2" },
            { fi: "Kantasana", en: "Root word", level: "B2" },
            { fi: "Rakenne", en: "Structure", level: "B2" },
            { fi: "Merkitys", en: "Meaning", level: "B2" },
            { fi: "Asiayhteys", en: "Context", level: "B2" },
            { fi: "Käsite", en: "Concept", level: "B2" },
            { fi: "Ilmiö", en: "Phenomenon", level: "B2" }
        ];

        const GameApp = () => {
            const [gameState, setGameState] = useState('menu'); // menu, mode_select, playing, gameover
            const [currentLevel, setCurrentLevel] = useState('all');
            const [gameMode, setGameMode] = useState('classic'); // classic, survival, time_attack
            const [score, setScore] = useState(0);
            const [streak, setStreak] = useState(0);
            const [bestStreak, setBestStreak] = useState(0);
            const [questionCount, setQuestionCount] = useState(0);
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [feedback, setFeedback] = useState(null); // null, correct, incorrect
            const [pool, setPool] = useState([]);
            const [timeLeft, setTimeLeft] = useState(60); // For time attack

            // Timer for Time Attack Mode
            useEffect(() => {
                let interval = null;
                if (gameState === 'playing' && gameMode === 'time_attack' && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                setGameState('gameover');
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [gameState, gameMode, timeLeft]);

            // Helper to transition to next question
            const nextTurn = (currentPool, nextCount) => {
                if (gameMode === 'classic' && (currentPool.length === 0 || nextCount >= 10)) {
                    setGameState('gameover');
                    return;
                }
                if (gameMode !== 'classic' && currentPool.length === 0) {
                     // Recycle vocabulary if pool runs out in infinite modes
                     const filtered = currentLevel === 'all' 
                        ? vocabularyDatabase 
                        : vocabularyDatabase.filter(w => w.level === currentLevel);
                     currentPool = [...filtered].sort(() => Math.random() - 0.5);
                }

                const correctWord = currentPool[0];
                const remainingPool = currentPool.slice(1);
                
                // Generate distractors
                const allDistractors = vocabularyDatabase
                    .filter(w => w.en !== correctWord.en)
                    .sort(() => Math.random() - 0.5)
                    .slice(0, 3);
                
                const options = [...allDistractors, correctWord].sort(() => Math.random() - 0.5);

                // Update State
                setPool(remainingPool);
                setCurrentQuestion({
                    word: correctWord,
                    options: options
                });
                setQuestionCount(nextCount);
                setFeedback(null);
            };

            // Init Game Setup
            const selectLevel = (level) => {
                setCurrentLevel(level);
                setGameState('mode_select');
            };

            // Start Game Logic
            const startGame = (mode) => {
                setGameMode(mode);
                const filtered = currentLevel === 'all' 
                    ? vocabularyDatabase 
                    : vocabularyDatabase.filter(w => w.level === currentLevel);
                
                const newPool = [...filtered].sort(() => Math.random() - 0.5);
                
                setScore(0);
                setStreak(0);
                setBestStreak(0);
                setTimeLeft(60);
                setGameState('playing');
                
                // Start first turn immediately
                nextTurn(newPool, 0);
            };

            const handleAnswer = (selectedOption) => {
                const isCorrect = selectedOption.en === currentQuestion.word.en;

                if (isCorrect) {
                    setScore(s => s + 1);
                    const newStreak = streak + 1;
                    setStreak(newStreak);
                    if (newStreak > bestStreak) setBestStreak(newStreak);
                    setFeedback('correct');

                    // Time Attack Bonus
                    if (gameMode === 'time_attack') {
                        setTimeLeft(t => t + 2);
                    }

                } else {
                    setStreak(0);
                    setFeedback('incorrect');

                    // Survival Mode End
                    if (gameMode === 'survival') {
                        setTimeout(() => {
                            setGameState('gameover');
                        }, 1500);
                        return;
                    }
                    
                    // Time Attack Penalty
                    if(gameMode === 'time_attack') {
                        setTimeLeft(t => Math.max(0, t - 5));
                    }
                }
                
                setTimeout(() => {
                    nextTurn(pool, questionCount + 1);
                }, 1500);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-green-50 to-blue-50">
                    <div className="w-full max-w-md bg-white rounded-xl shadow-2xl overflow-hidden border border-gray-100">
                        
                        {/* Header */}
                        <div className="bg-gradient-to-r from-green-600 to-emerald-600 p-6 text-white text-center shadow-md relative">
                            <h1 className="text-3xl font-bold tracking-tight">Sanakiitäjä</h1>
                            <p className="opacity-90 text-sm font-light">Vocabulary Master</p>
                            {gameState === 'playing' && (
                                <div className="absolute top-4 right-4 flex items-center space-x-1 bg-white/20 backdrop-blur-sm px-2 py-1 rounded-full">
                                    <span className="text-xl">🔥</span>
                                    <span className="font-bold">{streak}</span>
                                </div>
                            )}
                        </div>

                        {/* Main Menu - Level Select */}
                        {gameState === 'menu' && (
                            <div className="p-8 space-y-4 card-bounce">
                                <h2 className="text-center text-xl font-bold text-gray-700 mb-6">Valitse taso (Choose level)</h2>
                                <button onClick={() => selectLevel('A1-A2')} className="w-full py-4 bg-blue-50 hover:bg-blue-100 text-blue-800 rounded-xl font-semibold transition border border-blue-200 shadow-sm hover:shadow-md flex items-center justify-center space-x-2">
                                    <span>🌱</span><span>Level A1-A2 (Basic)</span>
                                </button>
                                <button onClick={() => selectLevel('B1')} className="w-full py-4 bg-yellow-50 hover:bg-yellow-100 text-yellow-800 rounded-xl font-semibold transition border border-yellow-200 shadow-sm hover:shadow-md flex items-center justify-center space-x-2">
                                    <span>🌿</span><span>Level B1 (Intermediate)</span>
                                </button>
                                <button onClick={() => selectLevel('B2')} className="w-full py-4 bg-red-50 hover:bg-red-100 text-red-800 rounded-xl font-semibold transition border border-red-200 shadow-sm hover:shadow-md flex items-center justify-center space-x-2">
                                    <span>🌳</span><span>Level B2 (Advanced)</span>
                                </button>
                                <button onClick={() => selectLevel('all')} className="w-full py-4 bg-gray-50 hover:bg-gray-100 text-gray-800 rounded-xl font-semibold transition border border-gray-200 shadow-sm hover:shadow-md flex items-center justify-center space-x-2">
                                    <span>🌍</span><span>All Levels (Mix)</span>
                                </button>
                            </div>
                        )}

                        {/* Mode Selection */}
                        {gameState === 'mode_select' && (
                            <div className="p-8 space-y-4 card-bounce">
                                <div className="flex justify-between items-center mb-4">
                                    <button onClick={() => setGameState('menu')} className="text-gray-400 hover:text-gray-600 text-sm">← Back</button>
                                    <h2 className="text-center text-xl font-bold text-gray-700">Valitse pelimuoto</h2>
                                    <div className="w-8"></div>
                                </div>
                                
                                <button onClick={() => startGame('classic')} className="w-full p-4 bg-white hover:bg-gray-50 text-left rounded-xl border-2 border-gray-100 hover:border-green-500 transition group shadow-sm">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <h3 className="font-bold text-gray-800 group-hover:text-green-600">Classic Quiz</h3>
                                            <p className="text-sm text-gray-500">10 questions. No stress.</p>
                                        </div>
                                        <span className="text-2xl">📝</span>
                                    </div>
                                </button>

                                <button onClick={() => startGame('survival')} className="w-full p-4 bg-white hover:bg-gray-50 text-left rounded-xl border-2 border-gray-100 hover:border-red-500 transition group shadow-sm">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <h3 className="font-bold text-gray-800 group-hover:text-red-600">Survival Mode</h3>
                                            <p className="text-sm text-gray-500">One mistake and it's over!</p>
                                        </div>
                                        <span className="text-2xl">❤️‍🔥</span>
                                    </div>
                                </button>

                                <button onClick={() => startGame('time_attack')} className="w-full p-4 bg-white hover:bg-gray-50 text-left rounded-xl border-2 border-gray-100 hover:border-purple-500 transition group shadow-sm">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <h3 className="font-bold text-gray-800 group-hover:text-purple-600">Time Attack</h3>
                                            <p className="text-sm text-gray-500">60 seconds. Race the clock!</p>
                                        </div>
                                        <span className="text-2xl">⏱️</span>
                                    </div>
                                </button>
                            </div>
                        )}

                        {/* Gameplay */}
                        {gameState === 'playing' && currentQuestion && (
                            <div className="p-6 relative">
                                {/* Progress / Timer Bar */}
                                {gameMode === 'time_attack' ? (
                                    <div className="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                                        <div 
                                            className={`h-2.5 rounded-full transition-all duration-1000 ${timeLeft < 10 ? 'bg-red-500' : 'bg-purple-600'}`} 
                                            style={{ width: `${(timeLeft / 60) * 100}%` }}
                                        ></div>
                                        <p className="text-center text-xs text-gray-500 mt-1">{timeLeft}s remaining</p>
                                    </div>
                                ) : (
                                    <div className="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                                        <div 
                                            className="bg-green-500 h-2.5 rounded-full progress-bar-transition" 
                                            style={{ width: `${(questionCount / (gameMode === 'classic' ? 10 : (questionCount + 10))) * 100}%` }}
                                        ></div>
                                         {gameMode === 'classic' && <p className="text-center text-xs text-gray-500 mt-1">{questionCount + 1} / 10</p>}
                                    </div>
                                )}

                                <div className="text-center mb-8 mt-4">
                                    <span className={`inline-block px-3 py-1 text-xs rounded-full mb-2 font-bold
                                        ${currentQuestion.word.level === 'B2' ? 'bg-red-100 text-red-800' : 
                                          currentQuestion.word.level === 'B1' ? 'bg-yellow-100 text-yellow-800' : 
                                          'bg-blue-100 text-blue-800'}`}>
                                        {currentQuestion.word.level}
                                    </span>
                                    <h2 className="text-4xl font-black text-gray-800 mb-2 tracking-wide">
                                        {currentQuestion.word.fi}
                                    </h2>
                                    <p className="text-gray-400 text-sm font-medium">Mitä tämä on englanniksi?</p>
                                </div>

                                <div className="space-y-3">
                                    {currentQuestion.options.map((opt, idx) => {
                                        let btnClass = "w-full p-4 text-left rounded-xl border-2 transition-all font-bold transform active:scale-95 ";
                                        
                                        if (feedback) {
                                            if (opt.en === currentQuestion.word.en) {
                                                btnClass += "bg-green-500 border-green-500 text-white shadow-lg scale-105";
                                            } else if (feedback === 'incorrect') {
                                                btnClass += "bg-gray-100 border-gray-200 text-gray-400 opacity-50";
                                            } else {
                                                btnClass += "bg-white border-gray-200 text-gray-400 opacity-50";
                                            }
                                        } else {
                                            btnClass += "bg-white border-gray-100 text-gray-600 hover:border-green-400 hover:bg-green-50 hover:text-green-700 hover:shadow-md";
                                        }

                                        return (
                                            <button 
                                                key={idx} 
                                                onClick={() => !feedback && handleAnswer(opt)}
                                                className={btnClass}
                                                disabled={!!feedback}
                                            >
                                                {opt.en}
                                            </button>
                                        );
                                    })}
                                </div>

                                {feedback && (
                                    <div className={`absolute inset-0 flex items-center justify-center pointer-events-none`}>
                                        <div className={`text-6xl card-bounce drop-shadow-xl ${feedback === 'correct' ? 'opacity-100' : 'opacity-100'}`}>
                                            {feedback === 'correct' ? '✨' : '❌'}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Game Over */}
                        {gameState === 'gameover' && (
                            <div className="p-8 text-center card-bounce">
                                <div className="text-7xl mb-6">
                                    {score >= (gameMode === 'classic' ? 8 : 15) ? '🏆' : 
                                     score >= (gameMode === 'classic' ? 5 : 5) ? '👏' : '📚'}
                                </div>
                                <h2 className="text-3xl font-bold text-gray-800 mb-2">Peli loppui!</h2>
                                
                                <div className="bg-gray-50 rounded-xl p-6 mb-8 space-y-3">
                                    <div className="flex justify-between items-center border-b border-gray-200 pb-2">
                                        <span className="text-gray-500">Score</span>
                                        <span className="text-2xl font-bold text-green-600">{score}</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-gray-500">Best Streak</span>
                                        <span className="text-xl font-bold text-orange-500">{bestStreak} 🔥</span>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <button onClick={() => startGame(gameMode)} className="w-full py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl font-bold transition shadow-lg transform hover:-translate-y-1">
                                        Pelaa uudestaan (Play Again)
                                    </button>
                                    <button onClick={() => setGameState('menu')} className="w-full py-3 bg-white hover:bg-gray-50 text-gray-600 rounded-xl font-semibold transition border border-gray-200">
                                        Päävalikko (Main Menu)
                                    </button>
                                </div>
                            </div>
                        )}

                    </div>
                    <div className="fixed bottom-4 text-center w-full text-gray-400 text-xs pointer-events-none">
                         Built with React & Tailwind
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GameApp />);
    </script>
</body>
</html>

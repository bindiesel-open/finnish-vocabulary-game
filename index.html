        /* Animations */
        .card-bounce { animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        .flip-container { perspective: 1000px; }
        .flip-card-inner { 
            transition: transform 0.6s; 
            transform-style: preserve-3d; 
            position: relative; 
            width: 100%; 
            height: 100%; 
        }
        .flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-front, .flip-back { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 0.75rem;
        }
        .flip-back { transform: rotateY(180deg); }
        
        @keyframes bounceIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .progress-transition { transition: width 0.5s ease-out; }
        
        /* Custom Scrollbar */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

            { fi: "Edellyttää", en: "To require/presuppose", level: "B2" }, { fi: "Keskittyä", en: "To concentrate", level: "B2" },
            { fi: "Perehtyä", en: "To familiarize oneself", level: "B2" }, { fi: "Poiketa", en: "To stop by/deviate", level: "B2" },
            { fi: "Arvostella", en: "To criticize/review", level: "B2" }, { fi: "Törmätä", en: "To collide/bump into", level: "B2" },
            { fi: "Keskeyttää", en: "To interrupt", level: "B2" }, { fi: "Haaveilla", en: "To dream (daydream)", level: "B2" },
            { fi: "Kaivata", en: "To miss/long for", level: "B2" }, { fi: "Vaikuttaa", en: "To seem/influence", level: "B2" },
            { fi: "Kuvailla", en: "To describe", level: "B2" }, { fi: "Johdos", en: "Derivative", level: "B2" },
            { fi: "Kantasana", en: "Root word", level: "B2" }, { fi: "Rakenne", en: "Structure", level: "B2" },
            { fi: "Merkitys", en: "Meaning", level: "B2" }, { fi: "Asiayhteys", en: "Context", level: "B2" },
            { fi: "Käsite", en: "Concept", level: "B2" }, { fi: "Ilmiö", en: "Phenomenon", level: "B2" }
        ];

        // ==========================================
        // 2. HELPERS
        // ==========================================
        const STORAGE_KEY = 'kiitajat_progress_v3';

        const loadStats = () => {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                const parsed = saved ? JSON.parse(saved) : {};
                // Ensure _global exists
                if (!parsed._global) {
                    parsed._global = { dailyStreak: 0, lastPlayed: null, bestStreak: 0 };
                }
                return parsed;
            } catch { 
                return { _global: { dailyStreak: 0, lastPlayed: null, bestStreak: 0 } }; 
            }
        };

        const saveStats = (newStats) => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(newStats));
        };

        const speakWord = (word) => {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'fi-FI';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        };

        // ==========================================
        // 3. GAME COMPONENT
        // ==========================================
        const GameApp = () => {
            const [gameState, setGameState] = useState('menu'); // menu, mode_select, study_mode, playing, gameover, settings, word_list
            const [currentLevel, setCurrentLevel] = useState('all');
            const [gameMode, setGameMode] = useState('classic'); // classic, survival, time_attack, typing
            
            // Game State
            const [score, setScore] = useState(0);
            const [streak, setStreak] = useState(0);
            const [questionCount, setQuestionCount] = useState(0);
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [feedback, setFeedback] = useState(null); 
            const [pool, setPool] = useState([]);
            const [timeLeft, setTimeLeft] = useState(60);
            const [typingInput, setTypingInput] = useState("");
            
            // Study State
            const [isFlipped, setIsFlipped] = useState(false);
            
            // Word List State
            const [wordListFilter, setWordListFilter] = useState('all'); // all, mastered, weak

            // Persistent Data
            const [userStats, setUserStats] = useState(loadStats());

            // Init daily streak check
            useEffect(() => {
                const checkDailyStreak = () => {
                    const stats = loadStats();
                    const today = new Date().toDateString();
                    const last = stats._global.lastPlayed;
                    
                    if (last !== today) {
                        // It's a new day or first time
                        const yesterday = new Date();
                        yesterday.setDate(yesterday.getDate() - 1);
                        
                        let newStreak = stats._global.dailyStreak;
                        
                        if (last === yesterday.toDateString()) {
                            // Played yesterday, streak continues (incremented on play, usually)
                            // We just maintain it until they play today
                        } else {
                            // Missed a day (or more), or first time. 
                            // But we don't reset to 0 immediately, we wait for them to play to set to 1.
                            // Actually, simplified logic: logic inside handleAnswer updates streak
                        }
                    }
                };
                checkDailyStreak();
            }, []);

            // Timer for Time Attack
            useEffect(() => {
                let interval = null;
                if (gameState === 'playing' && gameMode === 'time_attack' && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                setGameState('gameover');
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [gameState, gameMode, timeLeft]);

            // Focus input on typing mode
            const inputRef = useRef(null);
            useEffect(() => {
                if (gameState === 'playing' && gameMode === 'typing' && currentQuestion && !feedback) {
                    inputRef.current?.focus();
                }
            }, [currentQuestion, feedback, gameState, gameMode]);

            // --- LOGIC ---

            const getWeakWords = () => {
                return vocabularyDatabase.filter(word => {
                    const stat = userStats[word.fi];
                    if (!stat || stat.attempts === 0) return false;
                    return (stat.correct / stat.attempts) < 0.6 || (stat.incorrect > 0 && stat.streak < 2);
                });
            };

            const updateWordStat = (wordFi, isCorrect) => {
                setUserStats(prev => {
                    // Word Stats
                    const oldStat = prev[wordFi] || { attempts: 0, correct: 0, incorrect: 0, streak: 0, mastered: false };
                    const newStreak = isCorrect ? oldStat.streak + 1 : 0;
                    const newStat = {
                        attempts: oldStat.attempts + 1,
                        correct: oldStat.correct + (isCorrect ? 1 : 0),
                        incorrect: oldStat.incorrect + (isCorrect ? 0 : 1),
                        streak: newStreak,
                        mastered: newStreak >= 3
                    };

                    // Global Stats Update (Daily Streak)
                    const global = { ...prev._global };
                    const today = new Date().toDateString();
                    
                    if (global.lastPlayed !== today) {
                        // First game of the day!
                        const yesterday = new Date();
                        yesterday.setDate(yesterday.getDate() - 1);
                        
                        if (global.lastPlayed === yesterday.toDateString()) {
                            global.dailyStreak += 1;
                        } else {
                            global.dailyStreak = 1; // Reset or start new
                        }
                        global.lastPlayed = today;
                    }

                    const newStats = { ...prev, [wordFi]: newStat, _global: global };
                    saveStats(newStats);
                    return newStats;
                });
            };

            const nextTurn = (currentPool, nextCount) => {
                if ((gameMode === 'classic' || gameMode === 'typing') && (currentPool.length === 0 || nextCount >= 10)) {
                    setGameState('gameover');
                    return;
                }
                
                if (currentPool.length === 0) {
                    if (gameMode === 'review') { setGameState('gameover'); return; }
                    // Recycle for infinite
                    const filtered = currentLevel === 'all' ? vocabularyDatabase : vocabularyDatabase.filter(w => w.level === currentLevel);
                    currentPool = [...filtered].sort(() => Math.random() - 0.5);
                }

                const correctWord = currentPool[0];
                const remainingPool = currentPool.slice(1);
                
                const allDistractors = vocabularyDatabase.filter(w => w.en !== correctWord.en).sort(() => Math.random() - 0.5).slice(0, 3);
                const options = [...allDistractors, correctWord].sort(() => Math.random() - 0.5);

                setPool(remainingPool);
                setCurrentQuestion({ word: correctWord, options: options });
                setQuestionCount(nextCount);
                setFeedback(null);
                setTypingInput("");
            };

            const startGame = (mode) => {
                setGameMode(mode);
                let initialPool = [];

                if (mode === 'review') {
                    initialPool = getWeakWords();
                    if (initialPool.length === 0) {
                        alert("Ei kerrattavaa! (No weak words found yet!)");
                        return;
                    }
                } else {
                    initialPool = currentLevel === 'all' ? vocabularyDatabase : vocabularyDatabase.filter(w => w.level === currentLevel);
                }
                
                setPool([...initialPool].sort(() => Math.random() - 0.5));
                setScore(0);
                setStreak(0);
                setTimeLeft(60);
                
                if (mode === 'study') {
                    setGameState('study_mode');
                    setPool([...initialPool].sort(() => Math.random() - 0.5)); // Study needs pool too
                } else {
                    setGameState('playing');
                    nextTurn([...initialPool].sort(() => Math.random() - 0.5), 0);
                }
            };

            const handleAnswer = (answerEn) => {
                const isCorrect = answerEn.toLowerCase().trim() === currentQuestion.word.en.toLowerCase().trim();
                updateWordStat(currentQuestion.word.fi, isCorrect);

                if (isCorrect) {
                    setScore(s => s + (gameMode === 'typing' ? 2 : 1)); // Double points for typing
                    setStreak(s => s + 1);
                    setFeedback('correct');
                    if (gameMode === 'time_attack') setTimeLeft(t => t + 2);
                    
                    // Check best streak
                    if (streak + 1 > userStats._global.bestStreak) {
                         const newGlobal = { ...userStats._global, bestStreak: streak + 1 };
                         setUserStats(p => ({ ...p, _global: newGlobal }));
                         saveStats({ ...userStats, _global: newGlobal });
                    }

                } else {
                    setStreak(0);
                    setFeedback('incorrect');
                    if (gameMode === 'survival') {
                        setTimeout(() => setGameState('gameover'), 2000);
                        return;
                    }
                    if (gameMode === 'time_attack') setTimeLeft(t => Math.max(0, t - 5));
                }
                
                setTimeout(() => nextTurn(pool, questionCount + 1), isCorrect ? 1200 : 2500);
            };

            // --- RENDERERS ---

            const renderLevelProgress = () => {
                const levels = ['A1-A2', 'B1', 'B2'];
                return (
                    <div className="space-y-4 mb-6">
                        {levels.map(lvl => {
                            const total = vocabularyDatabase.filter(w => w.level === lvl).length;
                            const mastered = vocabularyDatabase
                                .filter(w => w.level === lvl)
                                .filter(w => userStats[w.fi]?.mastered).length;
                            const percent = total > 0 ? Math.round((mastered / total) * 100) : 0;
                            
                            let color = 'bg-blue-500';
                            if (lvl === 'B1') color = 'bg-yellow-500';
                            if (lvl === 'B2') color = 'bg-red-500';

                            return (
                                <div key={lvl} className="bg-white border border-gray-100 rounded-xl p-3 shadow-sm">
                                    <div className="flex justify-between text-xs font-bold text-gray-600 mb-1">
                                        <span>Level {lvl}</span>
                                        <span>{mastered} / {total} ({percent}%)</span>
                                    </div>
                                    <div className="w-full bg-gray-100 rounded-full h-2">
                                        <div className={`h-2 rounded-full ${color}`} style={{ width: `${percent}%` }}></div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                );
            };

            const renderStats = () => {
                const wordsSeen = Object.keys(userStats).filter(k => k !== '_global').length;
                const mastered = Object.values(userStats).filter(s => s.mastered).length;
                const weakCount = getWeakWords().length;
                return (
                    <div className="p-6 card-bounce h-full flex flex-col overflow-y-auto scrollbar-hide">
                        <h2 className="text-2xl font-bold text-gray-800 mb-4 text-center">Progress Report</h2>
                        
                        {/* Daily Streak Banner */}
                        <div className="bg-gradient-to-r from-orange-500 to-pink-500 p-4 rounded-2xl text-white mb-6 flex items-center justify-between shadow-lg">
                             <div>
                                <div className="text-xs font-bold opacity-90 uppercase tracking-wider">Daily Streak</div>
                                <div className="text-3xl font-black">{userStats._global.dailyStreak} Days</div>
                             </div>
                             <div className="text-5xl opacity-50">🔥</div>
                        </div>

                        <div className="grid grid-cols-2 gap-3 mb-6">
                            <div className="bg-blue-50 p-3 rounded-xl text-center">
                                <div className="text-xl font-black text-blue-700">{wordsSeen}</div>
                                <div className="text-xs font-bold text-blue-600">Words Seen</div>
                            </div>
                            <div className="bg-purple-50 p-3 rounded-xl text-center">
                                <div className="text-xl font-black text-purple-700">{userStats._global.bestStreak}</div>
                                <div className="text-xs font-bold text-purple-600">Best Streak</div>
                            </div>
                        </div>
                        
                        <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">Mastery by Level</h3>
                        {renderLevelProgress()}

                        <button onClick={() => setGameState('word_list')} className="w-full py-3 bg-indigo-50 text-indigo-700 rounded-xl font-bold mb-3 flex items-center justify-center gap-2 hover:bg-indigo-100 transition">
                            <Icons.List size={18}/> View Word List
                        </button>

                        <button onClick={() => setGameState('menu')} className="w-full py-3 bg-gray-800 text-white rounded-xl font-bold hover:bg-gray-900 transition">Back to Menu</button>
                    </div>
                );
            };

            const renderWordList = () => {
                const words = vocabularyDatabase.filter(w => {
                    if (wordListFilter === 'mastered') return userStats[w.fi]?.mastered;
                    if (wordListFilter === 'weak') {
                        const stat = userStats[w.fi];
                        if (!stat) return false;
                        return (stat.correct / stat.attempts) < 0.6 || (stat.incorrect > 0 && stat.streak < 2);
                    }
                    return true; // all
                });

                return (
                    <div className="p-0 h-full flex flex-col">
                        <div className="p-4 bg-white border-b border-gray-100 flex items-center justify-between shrink-0">
                            <button onClick={() => setGameState('stats')} className="text-sm font-bold text-gray-400 hover:text-gray-600">← Back</button>
                            <div className="text-lg font-bold text-gray-800">Vocabulary</div>
                            <div className="w-8"></div>
                        </div>

                        <div className="flex p-2 gap-2 bg-gray-50 shrink-0">
                            {['all', 'mastered', 'weak'].map(f => (
                                <button 
                                    key={f}
                                    onClick={() => setWordListFilter(f)}
                                    className={`flex-1 py-2 rounded-lg text-xs font-bold capitalize ${wordListFilter === f ? 'bg-white shadow-sm text-blue-600' : 'text-gray-400 hover:bg-white/50'}`}
                                >
                                    {f}
                                </button>
                            ))}
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-2 scrollbar-hide">
                            {words.length === 0 && (
                                <div className="text-center text-gray-400 py-8 text-sm">No words found in this category.</div>
                            )}
                            {words.map((w, i) => {
                                const stat = userStats[w.fi] || {};
                                const isMastered = stat.mastered;
                                const isWeak = (stat.correct / stat.attempts) < 0.6 && stat.attempts > 0;
                                
                                return (
                                    <div key={i} className="bg-white border border-gray-100 rounded-xl p-3 flex items-center justify-between shadow-sm">
                                        <div>
                                            <div className="font-bold text-gray-800 flex items-center gap-2">
                                                {w.fi}
                                                {isMastered && <span className="text-green-500"><Icons.Check size={14} /></span>}
                                                {isWeak && <span className="text-orange-500"><Icons.Flame size={14} /></span>}
                                            </div>
                                            <div className="text-xs text-gray-500">{w.en}</div>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <span className={`text-[10px] font-bold px-2 py-1 rounded-full ${w.level==='B2'?'bg-red-50 text-red-600':w.level==='B1'?'bg-yellow-50 text-yellow-600':'bg-blue-50 text-blue-600'}`}>{w.level}</span>
                                            <button onClick={() => speakWord(w.fi)} className="text-gray-300 hover:text-blue-500"><Icons.Volume2 size={18}/></button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            }

            const renderStudyMode = () => {
                if (pool.length === 0) return (
                    <div className="p-8 text-center card-bounce">
                        <div className="text-6xl mb-4">🎓</div>
                        <h2 className="text-2xl font-bold mb-4">Kertaus valmis!</h2>
                        <p className="mb-6 text-gray-600">Olet käynyt läpi kaikki sanat.</p>
                        <button onClick={() => setGameState('menu')} className="w-full py-3 bg-blue-600 text-white rounded-xl font-bold">Päävalikko</button>
                    </div>
                );

                const word = pool[0];
                return (
                    <div className="p-6 h-96 flex flex-col">
                        <div className="flex justify-between items-center mb-4">
                            <button onClick={() => setGameState('menu')} className="text-gray-400 font-bold hover:text-gray-600 text-sm">Exit</button>
                            <span className="text-gray-400 font-bold text-sm">{pool.length} left</span>
                        </div>
                        
                        <div className={`relative flex-1 cursor-pointer flip-container ${isFlipped ? 'flipped' : ''}`} onClick={() => setIsFlipped(!isFlipped)}>
                            <div className="flip-card-inner shadow-xl rounded-2xl">
                                {/* Front */}
                                <div className="flip-front bg-white border-2 border-blue-100 rounded-2xl flex flex-col items-center justify-center p-6">
                                    <span className="text-xs font-bold text-blue-400 uppercase tracking-widest mb-2">Finnish</span>
                                    <h2 className="text-4xl font-black text-gray-800 mb-4">{word.fi}</h2>
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); speakWord(word.fi); }}
                                        className="p-3 bg-blue-50 rounded-full text-blue-600 hover:bg-blue-100 transition"
                                    >
                                        <Icons.Volume2 size={24} />
                                    </button>
                                    <p className="mt-8 text-gray-400 text-sm font-medium">Tap to flip</p>
                                </div>
                                {/* Back */}
                                <div className="flip-back bg-blue-600 text-white rounded-2xl flex flex-col items-center justify-center p-6">
                                    <span className="text-xs font-bold text-blue-200 uppercase tracking-widest mb-2">English</span>
                                    <h2 className="text-3xl font-black">{word.en}</h2>
                                </div>
                            </div>
                        </div>

                        <div className="flex gap-3 mt-6">
                            <button 
                                onClick={() => { setIsFlipped(false); setPool(p => [...p.slice(1), p[0]]); }}
                                className="flex-1 py-3 bg-orange-100 text-orange-700 font-bold rounded-xl hover:bg-orange-200"
                            >
                                Again
                            </button>
                            <button 
                                onClick={() => { setIsFlipped(false); setPool(p => p.slice(1)); }}
                                className="flex-1 py-3 bg-green-100 text-green-700 font-bold rounded-xl hover:bg-green-200"
                            >
                                Got it
                            </button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-gradient-to-b from-blue-50 to-indigo-50 font-sans">
                    <div className="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-white/50 relative h-[600px] flex flex-col">
                        
                        {/* Header */}
                        {gameState !== 'study_mode' && gameState !== 'word_list' && (
                            <div className="bg-white p-4 flex justify-between items-center border-b border-gray-100 shrink-0">
                                <div className="flex items-center space-x-2">
                                    <div className="bg-blue-600 text-white p-2 rounded-lg">
                                        <Icons.Brain size={20} />
                                    </div>
                                    <h1 className="text-xl font-black text-gray-800 tracking-tight">Kiitäjät</h1>
                                </div>
                                <div className="flex space-x-2">
                                    {gameState === 'playing' && (
                                        <div className="flex items-center px-3 py-1 bg-orange-50 text-orange-600 rounded-full font-bold text-sm">
                                            🔥 {streak}
                                        </div>
                                    )}
                                    {gameState === 'menu' && (
                                        <button onClick={() => setGameState('settings')} className="p-2 text-gray-400 hover:bg-gray-50 rounded-lg">
                                            <Icons.Settings size={20} />
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* --- STATES --- */}

                        {/* 1. SETTINGS */}
                        {gameState === 'settings' && (
                            <div className="p-8 card-bounce">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6">Asetukset</h2>
                                <div className="space-y-4">
                                    <div className="p-4 bg-red-50 rounded-xl border border-red-100">
                                        <h3 className="font-bold text-red-800 mb-2">Danger Zone</h3>
                                        <button 
                                            onClick={() => { if(confirm('Are you sure?')) { localStorage.clear(); setUserStats({_global:{dailyStreak:0,lastPlayed:null,bestStreak:0}}); alert('Progress reset!'); } }}
                                            className="w-full py-2 bg-white border border-red-200 text-red-600 font-bold rounded-lg text-sm hover:bg-red-50"
                                        >
                                            Reset All Progress
                                        </button>
                                    </div>
                                    <button onClick={() => setGameState('menu')} className="w-full py-3 bg-gray-800 text-white font-bold rounded-xl">Close</button>
                                </div>
                            </div>
                        )}

                        {/* 2. MENU */}
                        {gameState === 'menu' && (
                            <div className="p-6 space-y-6 card-bounce overflow-y-auto">
                                <div>
                                    <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">Level</h3>
                                    <div className="grid grid-cols-2 gap-3">
                                        {['A1-A2', 'B1', 'B2', 'all'].map(lvl => (
                                            <button 
                                                key={lvl}
                                                onClick={() => { setCurrentLevel(lvl); setGameState('mode_select'); }}
                                                className={`p-4 rounded-xl border-2 font-bold text-sm transition-all ${currentLevel === lvl ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-gray-100 hover:border-blue-200 text-gray-600'}`}
                                            >
                                                {lvl === 'all' ? 'All' : lvl}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">Progress</h3>
                                    <button onClick={() => setGameState('stats')} className="w-full p-4 bg-gray-50 rounded-xl flex justify-between items-center hover:bg-gray-100 transition">
                                        <div className="flex items-center space-x-3">
                                            <div className="p-2 bg-white rounded-lg shadow-sm text-purple-500"><Icons.Brain size={18} /></div>
                                            <div className="text-left">
                                                <div className="font-bold text-gray-700">Stats & Words</div>
                                                <div className="text-xs text-gray-400">{userStats._global.dailyStreak} day streak</div>
                                            </div>
                                        </div>
                                        <Icons.ArrowRight size={18} className="text-gray-400" />
                                    </button>
                                </div>

                                {getWeakWords().length > 0 && (
                                    <button 
                                        onClick={() => { setCurrentLevel('all'); startGame('review'); }}
                                        className="w-full py-4 bg-gradient-to-r from-orange-500 to-red-500 text-white font-bold rounded-xl shadow-lg shadow-orange-200 flex items-center justify-center space-x-2 transform hover:scale-[1.02] transition"
                                    >
                                        <Icons.RotateCcw size={20} />
                                        <span>Review {getWeakWords().length} Weak Words</span>
                                    </button>
                                )}
                            </div>
                        )}

                        {/* 3. MODE SELECT */}
                        {gameState === 'mode_select' && (
                            <div className="p-6 space-y-3 card-bounce">
                                <button onClick={() => setGameState('menu')} className="text-sm font-bold text-gray-400 hover:text-gray-600 mb-2">← Back</button>
                                <h2 className="text-2xl font-black text-gray-800 mb-6">Select Mode</h2>
                                
                                <button onClick={() => startGame('study')} className="w-full p-4 bg-indigo-50 hover:bg-indigo-100 text-indigo-800 rounded-xl text-left flex items-center space-x-4 transition">
                                    <div className="bg-white p-3 rounded-lg shadow-sm"><Icons.Book size={24} /></div>
                                    <div><div className="font-bold">Study Cards</div><div className="text-xs opacity-75">Learn before you play</div></div>
                                </button>

                                <button onClick={() => startGame('classic')} className="w-full p-4 bg-blue-50 hover:bg-blue-100 text-blue-800 rounded-xl text-left flex items-center space-x-4 transition">
                                    <div className="bg-white p-3 rounded-lg shadow-sm"><Icons.Trophy size={24} /></div>
                                    <div><div className="font-bold">Classic Quiz</div><div className="text-xs opacity-75">10 Questions. Chill.</div></div>
                                </button>

                                <button onClick={() => startGame('typing')} className="w-full p-4 bg-pink-50 hover:bg-pink-100 text-pink-800 rounded-xl text-left flex items-center space-x-4 transition">
                                    <div className="bg-white p-3 rounded-lg shadow-sm"><Icons.Keyboard size={24} /></div>
                                    <div><div className="font-bold">Hard Mode</div><div className="text-xs opacity-75">Type the answer manually</div></div>
                                </button>

                                <div className="grid grid-cols-2 gap-3 pt-2">
                                    <button onClick={() => startGame('time_attack')} className="p-4 bg-purple-50 hover:bg-purple-100 text-purple-800 rounded-xl font-bold text-sm">Time Attack ⏱️</button>
                                    <button onClick={() => startGame('survival')} className="p-4 bg-red-50 hover:bg-red-100 text-red-800 rounded-xl font-bold text-sm">Survival ❤️</button>
                                </div>
                            </div>
                        )}

                        {/* 4. STUDY MODE */}
                        {gameState === 'study_mode' && renderStudyMode()}

                        {/* 5. STATS */}
                        {gameState === 'stats' && renderStats()}

                        {/* 5b. WORD LIST */}
                        {gameState === 'word_list' && renderWordList()}

                        {/* 6. PLAYING (Classic/Typing/Survival) */}
                        {gameState === 'playing' && currentQuestion && (
                            <div className="p-6">
                                {/* Progress Bar */}
                                <div className="w-full bg-gray-100 rounded-full h-2 mb-8 overflow-hidden">
                                    <div 
                                        className={`h-full transition-all duration-1000 ease-linear ${gameMode === 'time_attack' ? (timeLeft < 10 ? 'bg-red-500' : 'bg-purple-500') : 'bg-blue-500'}`}
                                        style={{ width: gameMode === 'time_attack' ? `${(timeLeft/60)*100}%` : `${(questionCount / (gameMode === 'classic' ? 10 : questionCount + 10)) * 100}%` }}
                                    ></div>
                                </div>

                                {/* Question Card */}
                                <div className="text-center mb-8">
                                    <div className="inline-flex items-center justify-center space-x-2 mb-4">
                                        <span className={`px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${
                                            currentQuestion.word.level === 'B2' ? 'bg-red-100 text-red-700' : 
                                            currentQuestion.word.level === 'B1' ? 'bg-yellow-100 text-yellow-700' : 'bg-blue-100 text-blue-700'
                                        }`}>
                                            {currentQuestion.word.level}
                                        </span>
                                        <button onClick={() => speakWord(currentQuestion.word.fi)} className="text-gray-400 hover:text-blue-500 transition"><Icons.Volume2 size={20}/></button>
                                    </div>
                                    
                                    <h2 className="text-4xl font-black text-gray-800 mb-2">{currentQuestion.word.fi}</h2>
                                    {gameMode === 'typing' && feedback === 'incorrect' && (
                                        <p className="text-red-500 font-bold animate-pulse">{currentQuestion.word.en}</p>
                                    )}
                                </div>

                                {/* Input Area */}
                                {gameMode === 'typing' ? (
                                    <div className="space-y-4">
                                        <input 
                                            ref={inputRef}
                                            type="text" 
                                            value={typingInput}
                                            onChange={(e) => setTypingInput(e.target.value)}
                                            onKeyDown={(e) => {
                                                if(e.key === 'Enter' && !feedback && typingInput.trim()) handleAnswer(typingInput);
                                            }}
                                            disabled={!!feedback}
                                            placeholder="Type English translation..."
                                            className={`w-full p-4 text-center text-lg font-bold rounded-xl border-2 outline-none transition ${
                                                feedback === 'correct' ? 'border-green-500 bg-green-50 text-green-700' :
                                                feedback === 'incorrect' ? 'border-red-500 bg-red-50 text-red-700 shake' :
                                                'border-gray-200 focus:border-blue-500'
                                            }`}
                                        />
                                        {!feedback && (
                                            <button 
                                                onClick={() => typingInput.trim() && handleAnswer(typingInput)}
                                                className="w-full py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition"
                                            >
                                                Check Answer
                                            </button>
                                        )}
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {currentQuestion.options.map((opt, idx) => {
                                            let stateClass = "bg-white border-gray-200 text-gray-600 hover:border-blue-400 hover:shadow-md";
                                            if (feedback) {
                                                if (opt.en === currentQuestion.word.en) stateClass = "bg-green-500 border-green-500 text-white shadow-lg scale-105";
                                                else if (feedback === 'incorrect') stateClass = "opacity-50";
                                            }
                                            
                                            return (
                                                <button 
                                                    key={idx} 
                                                    onClick={() => !feedback && handleAnswer(opt.en)}
                                                    disabled={!!feedback}
                                                    className={`w-full p-4 text-left rounded-xl border-2 font-bold transition-all transform ${stateClass}`}
                                                >
                                                    {opt.en}
                                                </button>
                                            );
                                        })}
                                    </div>
                                )}

                                {/* Feedback Overlay */}
                                {feedback && (
                                    <div className="absolute inset-0 pointer-events-none flex items-center justify-center">
                                        <div className={`text-8xl drop-shadow-2xl card-bounce ${feedback === 'correct' ? 'opacity-100' : 'opacity-80'}`}>
                                            {feedback === 'correct' ? '✨' : '❌'}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 7. GAME OVER */}
                        {gameState === 'gameover' && (
                            <div className="p-8 text-center card-bounce h-full flex flex-col justify-center">
                                <div className="text-7xl mb-4">{score >= 8 ? '🏆' : '🏁'}</div>
                                <h2 className="text-3xl font-black text-gray-800 mb-2">Peli päättyi!</h2>
                                <div className="text-gray-500 font-bold mb-8">Game Over</div>
                                
                                <div className="bg-gray-50 rounded-2xl p-6 mb-8">
                                    <div className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-1">Final Score</div>
                                    <div className="text-5xl font-black text-blue-600">{score}</div>
                                </div>

                                <div className="space-y-3">
                                    <button onClick={() => startGame(gameMode)} className="w-full py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition transform hover:-translate-y-1">Pelaa uudestaan</button>
                                    <button onClick={() => setGameState('menu')} className="w-full py-4 bg-white text-gray-600 font-bold rounded-xl border-2 border-gray-100 hover:bg-gray-50 transition">Päävalikko</button>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GameApp />);
    </script>
</body>
</html>
